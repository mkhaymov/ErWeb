<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elena Roginsky Arts</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #007bff;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--panel-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 100;
        }
        .brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }
        .logo-img {
            height: 35px;
            width: 35px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #333;
        }
        .brand-name,
        .gallery-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            font-family: inherit;
        }
        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--accent-color); }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .workspace-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }
        .grid-view-pane {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .preview-card {
            background-color: var(--panel-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            border: 1px solid #222;
        }
        .preview-img-frame {
            position: relative;
            width: 100%;
            height: 240px;
            background-color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .preview-info {
            padding: 15px;
            background-color: var(--panel-color);
            border-top: 1px solid #252525;
        }
        .preview-info h4 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 15px;
        }
        .preview-info p {
            margin: 2px 0;
            color: #999;
            font-size: 13px;
        }
        .single-view-pane {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            background: #050505;
            overflow-y: auto;
        }
        .image-stage {
            flex: 1;
            width: 100%;
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        .image-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            z-index: 2;
        }
        .image-wrapper:active { cursor: grabbing; }
        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .security-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7');
            z-index: 10;
        }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 20px;
            cursor: pointer;
            z-index: 50;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .nav-arrow:hover { background: rgba(0,0,0,0.9); }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }
        .metadata-panel {
            background-color: var(--panel-color);
            width: 100%;
            padding: 15px 20px;
            border-top: 1px solid #333;
            text-align: center;
            z-index: 40;
        }
        .metadata-panel h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #fff;
        }
        .metadata-panel p {
            margin: 4px 0;
            font-size: 14px;
            color: #aaa;
        }
        .metadata-panel .keywords {
            font-style: italic;
            font-size: 12px;
            color: #777;
            margin-top: 6px;
        }
        body.fullscreen-mode header,
        body.fullscreen-mode .metadata-panel {
            display: none !important;
        }
        body.fullscreen-mode .workspace-container {
            height: 100vh;
        }
        .workspace-container.show-single .grid-view-pane {
            display: none;
        }
        .workspace-container.show-single .single-view-pane {
            display: flex;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 12px 10px;
                text-align: center;
            }
            .brand-block {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 6px;
            }
            .logo-container {
                flex-direction: column;
                gap: 5px;
            }
            .brand-name { font-size: 16px; }
            .gallery-title { font-size: 12px; }
            .header-actions {
                width: 100%;
                justify-content: space-between;
                gap: 6px;
            }
            .header-actions .btn {
                flex: 1;
                padding: 8px 4px;
                font-size: 11px;
                text-align: center;
                white-space: nowrap;
            }
            .grid-view-pane {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                padding: 12px;
            }
            .preview-card { border-radius: 4px; }
            .preview-img-frame { height: 150px; }
            .preview-info { padding: 10px 8px; }
            .preview-info h4 {
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .preview-info p { font-size: 11px; }
            .nav-arrow { display: none !important; }
            .metadata-panel { padding: 12px 10px; }
            .metadata-panel h2 { font-size: 15px; }
            .metadata-panel p { font-size: 12px; }
            .single-view-pane {
                display: none;
                position: fixed !important;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                overflow-y: auto !important;
                background: #050505;
                z-index: 2000;
            }
            .image-stage {
                height: 70vh !important;
                width: 100% !important;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .metadata-panel {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
                padding: 20px 15px !important;
                background: #050505;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <header id="appHeader">
        <div class="brand-block">
            <a id="logoLink" href="index.html" class="logo-container">
                <img id="logoImg" src="logo.jpeg" alt="Logo" class="logo-img" onerror="this.style.display='none';">
                <span class="brand-name">Elena Roginsky Arts</span>
            </a>
            <span id="dynamic-gallery-title" class="gallery-title" aria-live="polite"></span>
        </div>

        <div class="header-actions">
            <button class="btn" id="backToGridBtn" style="display:none;" onclick="exitToGrid()">📅 Gallery View</button>
            <button class="btn" id="fsBtn" style="display:none;" onclick="toggleFullScreen()">🖥️ Full Screen</button>
            <a id="homeHubBtn" href="index.html" class="btn" style="text-decoration: none;">🏠 Main Page</a>
        </div>
    </header>

    <div class="workspace-container" id="workspace">
        <div class="grid-view-pane" id="gridView"></div>
        <div class="single-view-pane" id="singleView">
            <button class="nav-arrow" id="prevBtn" onclick="navigate(-1)">&#10094;</button>
            <button class="nav-arrow" id="nextBtn" onclick="navigate(1)">&#10095;</button>
            <div class="image-stage" id="stage">
                <div class="image-wrapper" id="imgWrapper">
                    <div class="security-shield"></div>
                    <img id="galleryImg" src="" alt="Gallery Viewport" draggable="false">
                </div>
            </div>
            <div class="metadata-panel" id="metadata">
                <h2 id="metaTitle">Artwork Details</h2>
                <p><span id="metaMedium"></span><span id="metaTechnic"></span> &bull; <span id="metaDimensions"></span> &bull; <span id="metaYear"></span></p>
            </div>
        </div>
    </div>

    <script>
        let allImages = [];
        let filteredImages = [];
        let currentIndex = 0;
        let scale = 1;
        let pointX = 0, pointY = 0;
        let startX = 0, startY = 0;
        let isPanning = false;
        let lastTouchDist = 0;
        let touchStartX = 0, touchStartY = 0;

        const workspace = document.getElementById('workspace');
        const gridView = document.getElementById('gridView');
        const singleView = document.getElementById('singleView');
        const imgWrapper = document.getElementById('imgWrapper');
        const galleryImg = document.getElementById('galleryImg');
        const stage = document.getElementById('stage');
        const backToGridBtn = document.getElementById('backToGridBtn');
        const fsBtn = document.getElementById('fsBtn');
        const homeHubBtn = document.getElementById('homeHubBtn');
        const logoLink = document.getElementById('logoLink');
        const logoImg = document.getElementById('logoImg');

        const DEFAULT_CONFIG = {
            brandName: 'Elena Roginsky Arts',
            logoUrl: 'logo.jpeg',
            imagesUrl: 'images.json'
        };

        function getConfigUrl() {
            return new URLSearchParams(window.location.search).get('config');
        }

        function resolveUrl(targetUrl, baseUrl) {
            if (!targetUrl) return targetUrl;
            if (/^https?:\/\//i.test(targetUrl)) {
                return targetUrl;
            }
            return new URL(targetUrl, baseUrl).toString();
        }

        function withConfig(pageName, extraParams = {}) {
            const currentUrl = new URL(window.location.href);
            const nextUrl = new URL(pageName, currentUrl.href);
            const configUrl = getConfigUrl();
            if (configUrl) {
                nextUrl.searchParams.set('config', configUrl);
            }
            for (const [key, value] of Object.entries(extraParams)) {
                if (value !== undefined && value !== null && value !== '') {
                    nextUrl.searchParams.set(key, String(value));
                }
            }
            return nextUrl.toString();
        }

        async function loadAppConfig() {
            const configUrl = getConfigUrl();
            let config = { ...DEFAULT_CONFIG };
            if (configUrl) {
                try {
                    const response = await fetch(configUrl);
                    if (response.ok) {
                        config = { ...config, ...(await response.json()) };
                    }
                } catch (error) {
                    console.warn('Unable to load external config; using defaults.', error);
                }
            }
            config.logoUrl = resolveUrl(config.logoUrl, configUrl || window.location.href);
            config.imagesUrl = resolveUrl(config.imagesUrl, configUrl || window.location.href);
            return config;
        }

        function getSearchQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('search') ? params.get('search').toLowerCase().trim() : '';
        }

        async function initCatalog() {
            try {
                const config = await loadAppConfig();
                const brandNameEl = document.querySelector('.brand-name');
                if (brandNameEl) brandNameEl.textContent = config.brandName || DEFAULT_CONFIG.brandName;
                if (logoImg) logoImg.src = config.logoUrl || DEFAULT_CONFIG.logoUrl;
                if (logoLink) logoLink.href = withConfig('index.html');
                if (homeHubBtn) homeHubBtn.href = withConfig('index.html');

                const response = await fetch(config.imagesUrl);
                allImages = await response.json();
                const searchQuery = getSearchQuery();
                if (searchQuery) {
                    filteredImages = allImages.filter(img => {
                        const haystack = [
                            img.title,
                            img.medium,
                            img.dimensions,
                            img.year,
                            img.keywords || ''
                        ].join(' ').toLowerCase();
                        return haystack.includes(searchQuery);
                    });
                } else {
                    filteredImages = allImages;
                }

                if (!filteredImages.length) {
                    document.getElementById('dynamic-gallery-title').textContent = 'No matches';
                    renderGrid();
                    return;
                }

                renderGrid();
                if (searchQuery) {
                    document.getElementById('dynamic-gallery-title').textContent = `Search: ${searchQuery}`;
                }
            } catch (e) {
                console.error('Error loading image catalog', e);
            }
        }

        function renderGrid() {
            gridView.innerHTML = '';
            filteredImages.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'preview-card';
                card.onclick = () => openSingleView(index);
                const imgUrl = resolveUrl(img.url, getConfigUrl() || window.location.href);
                card.innerHTML = `
                    <div class="preview-img-frame">
                        <img class="preview-img" src="${imgUrl}" alt="${img.title}">
                    </div>
                    <div class="preview-info">
                        <h4>${img.title}</h4>
                        <p>${img.medium || ''}${img.year ? ' • ' + img.year : ''}</p>
                    </div>
                `;
                gridView.appendChild(card);
            });
        }

        function openSingleView(index) {
            currentIndex = index;
            workspace.classList.add('show-single');
            showImage(currentIndex);
            backToGridBtn.style.display = 'inline-block';
            fsBtn.style.display = 'inline-block';
        }

        function closeSingleView() {
            workspace.classList.remove('show-single');
            backToGridBtn.style.display = 'none';
            fsBtn.style.display = 'none';
        }

        function exitToGrid() {
            closeSingleView();
        }

        function showImage(index) {
            const img = filteredImages[index];
            if (!img) return;
            const imgUrl = resolveUrl(img.url, getConfigUrl() || window.location.href);
            galleryImg.src = imgUrl;
            document.getElementById('metaTitle').textContent = img.title || 'Artwork';
            document.getElementById('metaMedium').textContent = img.medium || '';
            document.getElementById('metaTechnic').textContent = img.technique || '';
            document.getElementById('metaDimensions').textContent = img.dimensions || '';
            document.getElementById('metaYear').textContent = img.year || '';
            document.getElementById('dynamic-gallery-title').textContent = img.title || 'Gallery';
        }

        function navigate(direction) {
            currentIndex = (currentIndex + direction + filteredImages.length) % filteredImages.length;
            showImage(currentIndex);
        }

        function toggleFullScreen() {
            const element = document.body;
            if (!document.fullscreenElement) {
                element.requestFullscreen?.();
                document.body.classList.add('fullscreen-mode');
            } else {
                document.exitFullscreen?.();
                document.body.classList.remove('fullscreen-mode');
            }
        }

        document.getElementById('homeHubBtn').href = withConfig('index.html');
        document.getElementById('logoLink').href = withConfig('index.html');
        window.addEventListener('load', initCatalog);
    </script>
</body>
</html>
