<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elena Roginsky Arts</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #007bff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header including logo */
        header {
            background-color: var(--panel-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }
        .logo-img {
            height: 35px;
            width: 35px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #333;
        }
        .brand-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--accent-color); }
        .header-actions { display: flex; gap: 10px; }

        /* Multi-mode View Workspace */
        .workspace-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* 1. Uncropped Scrollable Grid View Layout */
        .grid-view-pane {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .preview-card {
            background-color: var(--panel-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            border: 1px solid #222;
        }
        
        .preview-img-frame {
            position: relative;
            width: 100%;
            height: 240px;
            background-color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Enforces strict uncropped aspect ratio */
            pointer-events: none;
        }
        
        .preview-info {
            padding: 15px;
            background-color: var(--panel-color);
            border-top: 1px solid #252525;
        }
        .preview-info h4 { margin: 0 0 5px 0; color: #fff; font-size: 15px; }
        .preview-info p { margin: 2px 0; color: #999; font-size: 13px; }

        /* 2. Standalone Single View Mode */
        .single-view-pane {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            background: #050505;
			overflow-y: auto; /* Allows scrolling if metadata is very long */
        }

        .image-stage {
            flex: 1;
            width: 100%;
			min-height: 50vh; /* Ensures the image area scales down on mobile to make room for text */
            /* height: 100%; *//* Force full viewport calculation */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px; /* Prevents image from hitting header/footer edges */
        }

        .image-wrapper {
            position: relative;
            display: flex; /* Changed from inline-block to flex */
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            z-index: 2;
        }
        .image-wrapper:active { cursor: grabbing; }
        
        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;  /* Forces accurate aspect ratio preservation */
            height: auto; /* Forces accurate aspect ratio preservation */
            object-fit: contain;
            display: block;
            pointer-events: none;
        }



        /* Anti-Copy Protection Security Shields */
        .security-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7');
            z-index: 10;
        }

        /* Controls overrides */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 20px;
            cursor: pointer;
            z-index: 50;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .nav-arrow:hover { background: rgba(0,0,0,0.9); }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }

        .metadata-panel {
            background-color: var(--panel-color);
            width: 100%;
            padding: 15px 20px;
            border-top: 1px solid #333;
            text-align: center;
            z-index: 40;
        }
        .metadata-panel h2 { margin: 0 0 5px 0; font-size: 18px; color: #fff; }
        .metadata-panel p { margin: 4px 0; font-size: 14px; color: #aaa; }
        .metadata-panel .keywords { font-style: italic; font-size: 12px; color: #777; margin-top: 6px; }

        /* Fullscreen Modifiers */
        body.fullscreen-mode header,
        body.fullscreen-mode .metadata-panel {
            display: none !important;
        }
        body.fullscreen-mode .workspace-container { height: 100vh; }

        /* View Mode Active Hooks */
        .workspace-container.show-single .grid-view-pane { display: none; }
        .workspace-container.show-single .single-view-pane { display: flex; }
		
		        /* --- NEW CODE ADDITION FOR MOBILE SCREEN DEPLOYMENTS --- */
        @media (max-width: 768px) {
            /* 1. Stack the header layout into standard vertical lines */
            header {
                flex-direction: column;
                gap: 12px;
                padding: 12px 10px;
                text-align: center;
            }

            .logo-container {
                flex-direction: column;
                gap: 5px;
            }

            .brand-name {
                font-size: 16px; /* Prevents title formatting wrapping anomalies */
            }

            /* 2. Format interactive navigation headers evenly across mobile viewports */
            .header-actions {
                width: 100%;
                justify-content: space-between;
                gap: 6px;
            }

            .header-actions .btn {
                flex: 1; /* Grants explicit equal widths to header navigation options */
                padding: 8px 4px;
                font-size: 11px; /* Downsizes text gracefully to fit compact screens */
                text-align: center;
                white-space: nowrap;
            }

            /* 3. Reconfigure the masonry preview grid into a fluid 2-column gallery grid */
            .grid-view-pane {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                padding: 12px;
            }

            .preview-card {
                border-radius: 4px;
            }

            .preview-img-frame {
                height: 150px; /* Reduces excessive scaling bounds for smaller viewports */
            }

            .preview-info {
                padding: 10px 8px;
            }

            .preview-info h4 {
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis; /* Gracefully shortens overflow text strings */
            }

            .preview-info p {
                font-size: 11px;
            }

            /* 4. Hide desktop arrow overlays to prevent touch interference */
            .nav-arrow {
                display: none !important; /* Rely entirely on your native touch-swipe listener rules */
            }

            /* 5. Optimize metadata panels at the foot of single-view layouts */
            .metadata-panel {
                padding: 12px 10px;
            }

            .metadata-panel h2 {
                font-size: 15px;
            }

            .metadata-panel p {
                font-size: 12px;
            }
        }

    </style>
</head>
<body oncontextmenu="return false;">

    <header id="appHeader">
        <!-- Logo added to Catalog View Header -->
        <a href="index.html" class="logo-container">
            <img src="logo.jpeg" alt="Logo" class="logo-img" onerror="this.style.display='none';">
            <span class="brand-name">Elena Roginsky Arts</span>
        </a>
        <div class="header-actions">
            <button class="btn" id="backToGridBtn" style="display:none;" onclick="exitToGrid()">📅 Gallery View</button>
            <button class="btn" id="fsBtn" style="display:none;" onclick="toggleFullScreen()">🖥️ Full Screen</button>
            <a href="index.html" class="btn" id="homeHubBtn" style="text-decoration: none;">🏠 Main Page</a>
        </div>
    </header>

    <div class="workspace-container" id="workspace">
        <!-- Grid View Pane -->
        <div class="grid-view-pane" id="gridView">
            <!-- Rendered via JS -->
        </div>

        <!-- Single View Viewport Pane -->
        <div class="single-view-pane" id="singleView">
            <button class="nav-arrow" id="prevBtn" onclick="navigate(-1)">&#10094;</button>
            <button class="nav-arrow" id="nextBtn" onclick="navigate(1)">&#10095;</button>

            <div class="image-stage" id="stage">
                <div class="image-wrapper" id="imgWrapper">
                    <div class="security-shield"></div>
                    <img id="galleryImg" src="" alt="Gallery Viewport" draggable="false">
                </div>
            </div>

            <div class="metadata-panel" id="metadata">
                <h2 id="metaTitle">Artwork Details</h2>
                <p><span id="metaMedium"></span> &bull; <span id="metaDimensions"></span> &bull; <span id="metaYear"></span></p>
                <!-- <div class="keywords" id="metaKeywords"></div> -->
            </div>
        </div>
    </div>

    <script>
        let allImages = [];
        let filteredImages = [];
        let currentIndex = 0;

        // Zoom & Pan System Parameters
        let scale = 1;
        let pointX = 0, pointY = 0;
        let startX = 0, startY = 0;
        let isPanning = false;

        // Touch Interaction tracking (Mobile multi-touch setup)
        let lastTouchDist = 0;
        let touchStartX = 0, touchStartY = 0;

        const workspace = document.getElementById('workspace');
        const gridView = document.getElementById('gridView');
        const singleView = document.getElementById('singleView');
        const imgWrapper = document.getElementById('imgWrapper');
        const galleryImg = document.getElementById('galleryImg');
        const stage = document.getElementById('stage');
        
        const backToGridBtn = document.getElementById('backToGridBtn');
        const fsBtn = document.getElementById('fsBtn');
        const homeHubBtn = document.getElementById('homeHubBtn');


        // Extract search parameters from address string
        function getSearchQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('search') ? params.get('search').toLowerCase().trim() : '';
        }

        async function initCatalog() {
            try {
                const response = await fetch('images.json');
                allImages = await response.json();
                
                const searchQuery = getSearchQuery();
                
                // Direct filtering on individual images based on keywords, title, medium
                if(searchQuery) {
                    filteredImages = allImages.filter(img => {
                        return (img.title && img.title.toLowerCase().includes(searchQuery)) ||
                               (img.keywords && img.keywords.toLowerCase().includes(searchQuery)) ||
                               (img.medium && img.medium.toLowerCase().includes(searchQuery));
                    });
                } else {
                    filteredImages = [...allImages];
                }

                renderGrid();
            } catch (error) {
                console.error(error);
                gridView.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px;">Error parsing core images.json workspace.</div>`;
            }
        }

        function renderGrid() {
            workspace.classList.remove('show-single');
            backToGridBtn.style.display = 'none';
            fsBtn.style.display = 'none';
            homeHubBtn.style.display = 'inline-block';
            
            gridView.innerHTML = '';
            
            if(filteredImages.length === 0) {
                gridView.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: #777;">No matching individual artworks found for your query.</div>`;
                return;
            }

            filteredImages.forEach((img, idx) => {
                const card = document.createElement('div');
                card.className = 'preview-card';
                card.onclick = () => launchSingleView(idx);
                card.innerHTML = `
                    <div class="preview-img-frame">
                        <div class="security-shield"></div>
                        <img src="${img.url}" alt="${img.title}" class="preview-img" draggable="false">
                    </div>
                    <div class="preview-info">
                        <h4>${img.title || 'Untitled'}</h4>
                        <p>${img.medium || 'N/A'} &bull; ${img.year || 'Unknown'}</p>
                    </div>
                `;
                gridView.appendChild(card);
            });
        }

        function launchSingleView(index) {
            currentIndex = index;
            workspace.classList.add('show-single');
            backToGridBtn.style.display = 'inline-block';
            fsBtn.style.display = 'inline-block';
            homeHubBtn.style.display = 'none';
            renderActiveImage();
        }

        function exitToGrid() {
            resetZoom();
            if(document.fullscreenElement) document.exitFullscreen();
            renderGrid();
        }

        function renderActiveImage() {
            resetZoom();
            const item = filteredImages[currentIndex];
            galleryImg.src = item.url;
            
            document.getElementById('metaTitle').innerText = item.title || 'Untitled';
            document.getElementById('metaYear').innerText = item.year || 'N/A';
            document.getElementById('metaMedium').innerText = item.medium || 'N/A';
            document.getElementById('metaDimensions').innerText = item.dimensions || '';
            // Add an IF safety check so it won't crash when the element is missing or commented out:
            const metaKeywords = document.getElementById('metaKeywords');
            if (metaKeywords) {
                metaKeywords.innerText = item.keywords ? `Keywords: ${item.keywords}` : '';
            }
        }

        function navigate(direction) {
            if(filteredImages.length <= 1) return;
            currentIndex += direction;
            if (currentIndex >= filteredImages.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = filteredImages.length - 1;
            renderActiveImage();
        }

        /* Desktop Zoom & Panning Engine Rules */
        stage.addEventListener('wheel', (e) => {
            if(!workspace.classList.contains('show-single')) return;
            e.preventDefault();
            const intensity = 0.1;
            scale = e.deltaY < 0 ? scale + intensity : scale - intensity;
            scale = Math.min(Math.max(1, scale), 5);
            if(scale === 1) { pointX = 0; pointY = 0; }
            updateTransform();
        });

        imgWrapper.addEventListener('mousedown', (e) => {
            if (scale === 1) return;
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            isPanning = true;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateTransform();
        });
        window.addEventListener('mouseup', () => { isPanning = false; });

        /* Mobile Touch Gestures Engine (Pinch to Zoom & Swipe) */
        stage.addEventListener('touchstart', (e) => {
            if(!workspace.classList.contains('show-single')) return;
            if (e.touches.length === 2) {
                lastTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            } else if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                if(scale > 1) {
                    startX = e.touches[0].clientX - pointX;
                    startY = e.touches[0].clientY - pointY;
                    isPanning = true;
                }
            }
        });

        stage.addEventListener('touchmove', (e) => {
            if(!workspace.classList.contains('show-single')) return;
            if (e.touches.length === 2 && scale >= 1) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / lastTouchDist;
                scale = Math.min(Math.max(1, scale * factor), 5);
                lastTouchDist = dist;
                updateTransform();
            } else if (e.touches.length === 1 && isPanning) {
                e.preventDefault();
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });

        stage.addEventListener('touchend', (e) => {
            if(!workspace.classList.contains('show-single')) return;
            if (isPanning && e.touches.length === 0) {
                isPanning = false;
            }
            if (scale === 1 && e.changedTouches.length === 1 && !isPanning) {
                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(diffX) > 60 && Math.abs(diffY) < 40) {
                    navigate(diffX > 0 ? -1 : 1);
                }
            }
        });

        function updateTransform() {
            imgWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }
        function resetZoom() {
            scale = 1; pointX = 0; pointY = 0;
            updateTransform();
        }

        /* Fullscreen View handlers */
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.body.classList.add('fullscreen-mode');
            } else {
                document.body.classList.remove('fullscreen-mode');
                resetZoom();
            }
        });

		// Attaching click listener to wrapper to pierce through security-shield overlay safely
        document.getElementById('imgWrapper').addEventListener('click', function() {
            // Calls your existing toggleFullScreen function when clicked
            if (typeof toggleFullScreen === "function") {
                toggleFullScreen();
            } else {
                // Fallback layout toggle if your function behaves differently
                document.body.classList.toggle('fullscreen-mode');
            }
});


        // Hotkey mappings
        window.addEventListener('keydown', (e) => {
            if(!workspace.classList.contains('show-single')) return;
            if (e.key === "ArrowRight") navigate(1);
            if (e.key === "ArrowLeft") navigate(-1);
            if (e.key === "Escape" && !document.fullscreenElement) exitToGrid();
        });

        window.onload = initCatalog;
		
    </script>
</body>
</html>
